# DX-04: device-level smoke journey (start workout, log a set, minimize, resume, finish).
#
# Runs in CI on an Android emulator (.github/workflows/e2e.yml). Locally, with a
# device or emulator connected and the app installed:
#
#   maestro test .maestro/smoke-journey.yml
#
appId: com.benflex1.lifts
---
- launchApp:
    clearState: true

# Fresh state seeds the default routines; the Workout tab is the landing screen.
- assertVisible: 'Routines'
- assertVisible: 'Start Empty Workout'

# The routine list loads after the first screen paint and may sit below the fold.
- scrollUntilVisible:
    element:
      text: 'Start Push Day.*'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: 'Start Push Day.*'
    retryTapIfNoChange: true
- takeScreenshot: after-routine-tap
- extendedWaitUntil:
    visible: 'Start Workout'
    timeout: 10000
- tapOn: 'Start workout at.*'

# Logger: complete one set of the first exercise.
- assertVisible: 'Complete set 1'
- tapOn: 'Complete set 1'
- assertVisible: 'Complete set 2'

# Minimize to the floating bar, then resume.
- tapOn: 'Minimize workout'
- assertVisible:
    text: 'Resume workout.*'
- tapOn:
    text: 'Resume workout.*'
- assertVisible: 'Complete set 1'

# Finish and confirm the completion summary.
- tapOn: 'Finish workout'
- assertVisible: 'Workout Complete!'
- takeScreenshot: smoke-journey-complete
