Categories:
  - Sports & Health
  - Workout
License: MIT
AuthorName: Benflex1
SourceCode: https://github.com/Benflex1/lifts
IssueTracker: https://github.com/Benflex1/lifts/issues
Changelog: https://github.com/Benflex1/lifts/blob/HEAD/CHANGELOG.md

AutoName: Lifts

RepoType: git
Repo: https://github.com/Benflex1/lifts.git

Builds:
  - versionName: 1.0.1
    versionCode: 1000001
    commit: v1.0.1
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init: npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild --platform android --clean --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: r27b

MaintainerNotes: |-
  Lifts uses Expo/React Native and does not commit android/; the Android project
  is generated by `expo prebuild` after checkout. fdroidserver validates subdir
  before prebuild, so no subdir is set: output points at the generated APK and
  the build step runs Gradle from android/app.

  Upstream package.json builds every Expo module from source
  (expo.autolinking.android.buildFromSource) and excludes expo-notifications from
  Android autolinking, so no Firebase stub is needed: rest-timer notifications
  use the in-repo modules/rest-alarm module (AlarmManager + platform
  notifications). The bundled local-maven-repo AARs are removed before prebuild.

  The React Native Gradle plugin declares a Java 17 toolchain; the prebuild
  applies the 17-to-21 adjustment from F-Droid's React Native template. The
  upstream signing plugin only signs when LIFTS_UPLOAD_* variables are set; the
  remaining signingConfig lines are removed so the release APK is unsigned.

  Node.js/npm come from Debian forky. React Native 0.86 pins NDK 27.1.12297006
  (r27b).

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([\d.]+)"
CurrentVersion: 1.0.1
CurrentVersionCode: 1000001
