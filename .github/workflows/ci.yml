name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Version sync check
        run: npm run version:check

      - name: Dependency audit policy
        run: npm run audit:policy

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript typecheck (tests)
        run: npm run typecheck:tests

      - name: Tests and exercised-module coverage (unit + integration)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Android prebuild (applies config plugins)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Web bundle export
        run: npx expo export --platform web --output-dir dist-ci-web
