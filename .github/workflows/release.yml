name: Release

# Pushing a tag vX.Y.Z (matching expo.version in app.json) publishes a GitHub Release:
# - one APK per ABI, built unsigned by F-Droid's own tooling in its buildserver image
#   from .fdroid.yml and then signed with the upload key. F-Droid rebuilds the same
#   bytes, so it can ship these developer-signed APKs (reproducible builds);
# - a universal APK built with Gradle directly (not part of F-Droid).
# After publishing, F-Droid's verification is re-run against the published APKs.
# Running the workflow manually is a dry run: everything is built, signed, and verified
# and uploaded as workflow artifacts, but nothing is published.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json expo.version ($version)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          if ! grep -q "^  - versionName: $version\$" .fdroid.yml; then
            echo "::error::.fdroid.yml builds are not for version $version"
            exit 1
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTS_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LIFTS_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFTS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIFTS_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret LIFTS_UPLOAD_$name is not set (see docs/release-checklist.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit test suite
        run: npm test

      - name: Integration test suite
        run: npm run test:integration

  fdroid-build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned APK with fdroidserver
        env:
          ABI: ${{ matrix.abi }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          code=$(python3 scripts/fdroid-version-code.py "$ABI")
          bash scripts/fdroid-buildserver-check.sh "$SOURCE_REF" "$code" source
          mv "fdroid-check-output/lifts-fdroid-unsigned-$code.apk" "fdroid-check-output/unsigned-$ABI.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.abi }}
          path: fdroid-check-output/unsigned-${{ matrix.abi }}.apk
          if-no-files-found: error

      - name: Upload fdroid build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-log-${{ matrix.abi }}
          path: fdroid-check-output/fdroid-build.log
          if-no-files-found: warn

  universal:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "LIFTS_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed universal APK and AAB
        working-directory: android
        env:
          LIFTS_REQUIRE_RELEASE_SIGNING: 'true'
          LIFTS_UPLOAD_STORE_PASSWORD: ${{ secrets.LIFTS_UPLOAD_STORE_PASSWORD }}
          LIFTS_UPLOAD_KEY_ALIAS: ${{ secrets.LIFTS_UPLOAD_KEY_ALIAS }}
          LIFTS_UPLOAD_KEY_PASSWORD: ${{ secrets.LIFTS_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Check for non-free dependencies (F-Droid)
        run: scripts/check-android-nonfree.sh

      - name: Upload universal APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: universal
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish:
    needs: [checks, fdroid-build, universal]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Install apksigner 34.0.0 and apksigcopier
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          echo "APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          pipx install apksigcopier

      - name: Sign ABI APKs with the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTS_UPLOAD_KEYSTORE_BASE64 }}
          LIFTS_UPLOAD_STORE_PASSWORD: ${{ secrets.LIFTS_UPLOAD_STORE_PASSWORD }}
          LIFTS_UPLOAD_KEY_ALIAS: ${{ secrets.LIFTS_UPLOAD_KEY_ALIAS }}
          LIFTS_UPLOAD_KEY_PASSWORD: ${{ secrets.LIFTS_UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            "$APKSIGNER" sign --ks "$keystore" --ks-type PKCS12 \
              --ks-key-alias "$LIFTS_UPLOAD_KEY_ALIAS" \
              --ks-pass env:LIFTS_UPLOAD_STORE_PASSWORD --key-pass env:LIFTS_UPLOAD_KEY_PASSWORD \
              --out "release/lifts-$VERSION-$abi.apk" "build/unsigned-$abi/unsigned-$abi.apk"
          done
          cp build/universal/apk/release/app-release.apk "release/lifts-$VERSION-universal.apk"
          cp build/universal/bundle/release/app-release.aab "release/lifts-$VERSION.aab"

      - name: Verify signatures and F-Droid signature copy
        env:
          EXPECTED_CERT_SHA256: ${{ vars.LIFTS_UPLOAD_CERT_SHA256 }}
        run: |
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in release/*.apk; do
            certs=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$apk: $(grep 'certificate SHA-256 digest' <<<"$certs" | head -n 1)"
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the Android debug key"
              exit 1
            fi
            if [ -n "$expected" ] && ! grep -q "certificate SHA-256 digest: $expected" <<<"$certs"; then
              echo "::error::$apk signing certificate does not match vars.LIFTS_UPLOAD_CERT_SHA256"
              exit 1
            fi
          done
          # What F-Droid does: copy our signature onto its own unsigned build and verify.
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apksigcopier compare --unsigned "release/lifts-$VERSION-$abi.apk" "build/unsigned-$abi/unsigned-$abi.apk"
            echo "$abi: signature copies onto the unsigned F-Droid build"
          done

      - name: Collect checksums and notes
        run: |
          (cd release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l release
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/NOTES.md
          cat release/NOTES.md

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: lifts-${{ needs.checks.outputs.version }}-signed
          path: |
            release/*.apk
            release/*.aab
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS.txt \
            --title "Lifts $VERSION" \
            --notes-file release/NOTES.md \
            --verify-tag

  fdroid-verify:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and verify against the published APK
        env:
          ABI: ${{ matrix.abi }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          code=$(python3 scripts/fdroid-version-code.py "$ABI")
          bash scripts/fdroid-buildserver-check.sh "$SOURCE_REF" "$code" release
