name: Release

# Pushing a tag vX.Y.Z (matching expo.version in app.json) builds a signed APK and
# publishes it as a GitHub Release with notes from CHANGELOG.md.
# Running the workflow manually is a dry run: it builds and verifies the signed
# APK/AAB and uploads them as workflow artifacts without publishing anything.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json expo.version ($version)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTS_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LIFTS_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFTS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIFTS_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret LIFTS_UPLOAD_$name is not set (see docs/release-checklist.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit test suite
        run: npm test

      - name: Integration test suite
        run: npm run test:integration

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFTS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "LIFTS_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          LIFTS_REQUIRE_RELEASE_SIGNING: 'true'
          LIFTS_UPLOAD_STORE_PASSWORD: ${{ secrets.LIFTS_UPLOAD_STORE_PASSWORD }}
          LIFTS_UPLOAD_KEY_ALIAS: ${{ secrets.LIFTS_UPLOAD_KEY_ALIAS }}
          LIFTS_UPLOAD_KEY_PASSWORD: ${{ secrets.LIFTS_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.LIFTS_UPLOAD_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK is signed with the Android debug key"
            exit 1
          fi
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if ! grep -q "certificate SHA-256 digest: $expected" <<<"$certs"; then
              echo "::error::APK signing certificate does not match vars.LIFTS_UPLOAD_CERT_SHA256"
              exit 1
            fi
          fi

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/lifts-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/lifts-$VERSION.aab"
          (cd release && sha256sum "lifts-$VERSION.apk" > SHA256SUMS.txt)
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/NOTES.md
          cat release/NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifts-${{ steps.version.outputs.version }}-signed
          path: |
            release/*.apk
            release/*.aab
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/lifts-$VERSION.apk" \
            release/SHA256SUMS.txt \
            --title "Lifts $VERSION" \
            --notes-file release/NOTES.md \
            --verify-tag
