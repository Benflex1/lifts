name: Feature request
description: Propose a change in behavior, UX, or workflow.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Lifts is local-first: no accounts, no backend, no telemetry. Proposals that keep workouts on the device fit the project best.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Platforms affected, offline behavior, and anything this must not break (storage format, backup compatibility, gym isolation).
    validations:
      required: false
