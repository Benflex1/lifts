name: Bug report
description: Report a reproducible problem in the app or the repository.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security reports, use the private advisory flow in SECURITY.md instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a routine
        2. Complete a set
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Not platform-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The release you installed, for example 1.0.5.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, crash logs, or notes. Do not attach real training data from backups.
    validations:
      required: false
